name: sports-center

x-service: &service
  restart: unless-stopped
  networks:
    - backend

services:
  registration-service:
    <<: *service
    build: ./Registration_Microservice
    env_file:
      - ./Registration_Microservice/.env

  auth-service:
    <<: *service
    build: ./Authentication_Microservice
    env_file:
      - ./Authentication_Microservice/.env

  facility-service:
    <<: *service
    build: ./Facility_Microservice
    env_file:
      - ./Facility_Microservice/.env

  maintenance-service:
    <<: *service
    build: ./Maintenance_Microservice
    env_file:
      - ./Maintenance_Microservice/.env

  reservation-service:
    <<: *service
    build: ./Reservation_Microservice
    env_file:
      - ./Reservation_Microservice/.env

  matching-service:
    <<: *service
    build: ./Matching_Microservice
    env_file:
      - ./Matching_Microservice/.env

  api-gateway-1:
    <<: *service
    build: ./APIGateway_Microservice
    env_file:
      - ./APIGateway_Microservice/.env

  api-gateway-2:
    <<: *service
    build: ./APIGateway_Microservice
    env_file:
      - ./APIGateway_Microservice/.env

  load-balancer:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./load-balancer/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend
    depends_on:
      - api-gateway-1
      - api-gateway-2

networks:
  backend:
    driver: bridge
